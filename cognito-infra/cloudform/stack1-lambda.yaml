AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Stack 1 of 2 - Cognito Custom Message Lambda function.
  Deploy this first, then deploy stack2-pools.yaml.

# ----------------------------------------------------------
# Parameters
# ----------------------------------------------------------
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, stg, prod]

  ClientAppName:
    Type: String
    Default: "IHP Client"

  ClientResetPasswordPath:
    Type: String
    Default: "https://ihp.brycen.com.vn/reset-password"

  ClientLoginPath:
    Type: String
    Default: "https://ihp.brycen.com.vn/login"

  VendorAppName:
    Type: String
    Default: "IHP Vendor"

  VendorResetPasswordPath:
    Type: String
    Default: "https://ihp.brycen.com.vn/reset-password"

  VendorLoginPath:
    Type: String
    Default: "https://ihp.brycen.com.vn/login"

  OperatorAppName:
    Type: String
    Default: "IHP Operator"

  OperatorResetPasswordPath:
    Type: String
    Default: "https://ihp.brycen.com.vn/reset-password"

  OperatorLoginPath:
    Type: String
    Default: "https://ihp.brycen.com.vn/login"

# ----------------------------------------------------------
# Globals
# ----------------------------------------------------------
Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 128

# ----------------------------------------------------------
# Resources
# ----------------------------------------------------------
Resources:

  CognitoCustomMessageFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "cognito-custom-message-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CognitoDescribeUserPool
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: cognito-idp:DescribeUserPool
                Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*"

  CognitoCustomMessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "cognito-custom-message-${Environment}"
      CodeUri: ../lambda/custom_message/
      Handler: app.lambda_handler
      Role: !GetAtt CognitoCustomMessageFunctionRole.Arn
      Description: "Cognito Custom Message trigger - customises ForgotPassword and SignUp emails"
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          CLIENT_APP_NAME: !Ref ClientAppName
          CLIENT_RESET_PASSWORD_PATH: !Ref ClientResetPasswordPath
          CLIENT_LOGIN_PATH: !Ref ClientLoginPath
          VENDOR_APP_NAME: !Ref VendorAppName
          VENDOR_RESET_PASSWORD_PATH: !Ref VendorResetPasswordPath
          VENDOR_LOGIN_PATH: !Ref VendorLoginPath
          OPERATOR_APP_NAME: !Ref OperatorAppName
          OPERATOR_RESET_PASSWORD_PATH: !Ref OperatorResetPasswordPath
          OPERATOR_LOGIN_PATH: !Ref OperatorLoginPath
      Tags:
        Environment: !Ref Environment
        Project: cognito-infra

  CognitoCustomMessageLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/cognito-custom-message-${Environment}"
      RetentionInDays: 30

# ----------------------------------------------------------
# Outputs - exported for stack2-pools.yaml
# ----------------------------------------------------------
Outputs:
  LambdaFunctionArn:
    Description: ARN of the Custom Message Lambda - imported by stack2-pools
    Value: !GetAtt CognitoCustomMessageFunction.Arn
    Export:
      Name: !Sub "cognito-lambda-${Environment}-FunctionArn"
